<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Concrete | CMiC</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 177.78vh;
            height: 56.25vw;
            min-width: 100%;
            min-height: 100%;
            border: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .video-shade {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }

        .brand {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 10;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .brand-logo {
            display: block;
            width: clamp(220px, 35vw, 520px);
            max-width: 85vw;
            max-height: 70vh;
            object-fit: contain;
            filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.6));
        }

        .site-link {
            position: absolute;
            left: 50%;
            bottom: 16px;
            z-index: 20;
            transform: translateX(-50%);
            padding: 12px 18px;
            border-radius: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            text-decoration: none;
            font-size: clamp(14px, 1.15vw, 18px);
            white-space: nowrap;
        }

        .site-link:hover {
            background: rgba(0, 0, 0, 0.68);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="hero">
        <iframe
            class="background-video"
            src="https://www.youtube.com/embed/Mmg5GO3CZ_o?playlist=Mmg5GO3CZ_o&amp;loop=1&amp;autoplay=1&amp;mute=1&amp;controls=0&amp;rel=0&amp;playsinline=1"
            title="Martin Concrete background video"
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

        <div class="video-shade"></div>

        <div class="brand">
            <img
                class="brand-logo"
                src="BYOL-Round-Logo-no-whitespace.png"
                alt="Martin Concrete">
        </div>

        <a class="site-link"
           href="https://www.martinconcrete.com/"
           target="_blank"
           rel="noopener noreferrer">
            Visit Martin Concrete
        </a>
    </main>
</body>
</html>
